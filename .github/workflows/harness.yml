name: Harness checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate harness and architecture boundaries
        run: python scripts/check_harness.py --root .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
